name: publish

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' llm_model_cost/__init__.py)"
          setup_version="$(sed -n 's/.*version="\(.*\)",/\1/p' setup.py)"
          echo "tag=$tag_version package=$pkg_version setup.py=$setup_version"
          test "$tag_version" = "$pkg_version" && test "$tag_version" = "$setup_version"

      - name: Run tests
        run: uv run --with requests python -m unittest discover tests

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
